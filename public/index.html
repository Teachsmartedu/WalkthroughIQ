<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WalkthroughIQ — Instructional Quality • G8 Social Studies Observation Platform</title>
  <style>
    /* =========================================================================
       WALKTHROUGHIQ — SELF-CONTAINED DAYLIGHT-FIRST DESIGN SYSTEM
       Zero external script/font dependencies for 100% sandbox & offline reliability
       ========================================================================= */
    :root {
      --bg-canvas: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-muted: #e2e8f0;
      --border-light: #e2e8f0;
      --border-med: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --indigo-50: #eef2ff;
      --indigo-100: #e0e7ff;
      --indigo-200: #c7d2fe;
      --indigo-600: #4f46e5;
      --indigo-700: #4338ca;
      --indigo-800: #3730a3;
      --emerald-50: #ecfdf5;
      --emerald-100: #d1fae5;
      --emerald-200: #a7f3d0;
      --emerald-600: #059669;
      --emerald-700: #047857;
      --emerald-800: #065f46;
      --amber-50: #fffbeb;
      --amber-100: #fef3c7;
      --amber-200: #fde68a;
      --amber-500: #f59e0b;
      --amber-700: #b45309;
      --amber-800: #92400e;
      --rose-50: #fff1f2;
      --rose-100: #ffe4e6;
      --rose-200: #fecdd3;
      --rose-600: #e11d48;
      --rose-700: #be123c;
      --rose-800: #9f1239;
      --blue-50: #eff6ff;
      --blue-100: #dbeafe;
      --blue-200: #bfdbfe;
      --blue-600: #2563eb;
      --blue-700: #1d4ed8;
      --sky-50: #f0f9ff;
      --sky-200: #bae6fd;
      --sky-800: #075985;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 8px 20px rgba(15, 23, 42, 0.08);
      --shadow-xl: 0 20px 35px rgba(15, 23, 42, 0.14);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Header & Top Nav */
    .top-header {
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: var(--shadow-xs);
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--indigo-50);
      border: 1px solid var(--indigo-200);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--indigo-700);
      flex-shrink: 0;
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-name {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--indigo-50);
      color: var(--indigo-700);
      border: 1px solid var(--indigo-200);
    }

    .brand-tagline {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .nav-pills {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-subtle);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      flex-wrap: wrap;
    }

    .nav-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.7);
      color: var(--text-primary);
    }

    .nav-btn.active {
      background: var(--bg-surface);
      color: var(--indigo-700);
      border-color: var(--border-light);
      box-shadow: var(--shadow-xs);
    }

    .nav-count {
      background: var(--bg-surface);
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
      font-size: 11px;
      font-weight: 700;
      padding: 0 6px;
      border-radius: var(--radius-full);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .offline-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: var(--radius-md);
      background: var(--emerald-50);
      border: 1px solid var(--emerald-200);
      color: var(--emerald-800);
      font-size: 11px;
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald-600);
      display: inline-block;
    }

    /* Buttons */
    .btn {
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--indigo-600);
      color: #ffffff;
      box-shadow: var(--shadow-xs);
    }

    .btn-primary:hover {
      background: var(--indigo-700);
    }

    .btn-emerald {
      background: var(--emerald-600);
      color: #ffffff;
      box-shadow: var(--shadow-xs);
    }

    .btn-emerald:hover {
      background: var(--emerald-700);
    }

    .btn-outline {
      background: var(--bg-surface);
      color: var(--text-secondary);
      border-color: var(--border-med);
    }

    .btn-outline:hover {
      background: var(--bg-subtle);
      color: var(--text-primary);
    }

    .btn-soft-indigo {
      background: var(--indigo-50);
      color: var(--indigo-700);
      border-color: var(--indigo-200);
    }

    .btn-soft-indigo:hover {
      background: var(--indigo-100);
    }

    .btn-soft-sky {
      background: var(--sky-50);
      color: var(--sky-800);
      border-color: var(--sky-200);
    }

    .btn-soft-sky:hover {
      background: #e0f2fe;
    }

    .btn-sm {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
    }

    /* Main Layout */
    .main-container {
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }

    .stack-lg {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .stack-md {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Cards */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xs);
    }

    .card-padded {
      padding: 20px 24px;
    }

    .card-header {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border-light);
      background: #fafbfd;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg);
    }

    .card-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .card-subtitle {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Hero Banner */
    .hero-banner {
      background: linear-gradient(135deg, #ffffff 0%, #eef2ff 55%, #f0f9ff 100%);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 26px;
      box-shadow: var(--shadow-xs);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .hero-copy {
      max-width: 620px;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      background: var(--indigo-50);
      border: 1px solid var(--indigo-200);
      color: var(--indigo-800);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .hero-title {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .hero-desc {
      margin: 8px 0 0;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .hero-actions-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(155px, 1fr));
      gap: 12px;
    }

    .quick-action-card {
      text-align: left;
      padding: 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      background: var(--bg-surface);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-xs);
    }

    .quick-action-card:hover {
      border-color: var(--indigo-300, #a5b4fc);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .quick-action-card.primary-card {
      background: var(--indigo-600);
      border-color: var(--indigo-700);
      color: #ffffff;
    }

    .quick-action-card.primary-card:hover {
      background: var(--indigo-700);
    }

    /* Grids */
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .grid-6 {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
    }

    .grid-5 {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    /* KPI Cards */
    .kpi-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-primary);
      margin-top: 8px;
      line-height: 1.1;
    }

    .kpi-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .badge-emerald {
      background: var(--emerald-50);
      color: var(--emerald-800);
      border-color: var(--emerald-200);
    }

    .badge-amber {
      background: var(--amber-50);
      color: var(--amber-800);
      border-color: var(--amber-200);
    }

    .badge-rose {
      background: var(--rose-50);
      color: var(--rose-800);
      border-color: var(--rose-200);
    }

    .badge-blue {
      background: var(--blue-50);
      color: var(--blue-700);
      border-color: var(--blue-200);
    }

    .badge-indigo {
      background: var(--indigo-50);
      color: var(--indigo-800);
      border-color: var(--indigo-200);
    }

    .badge-slate {
      background: var(--bg-subtle);
      color: var(--text-secondary);
      border-color: var(--border-med);
    }

    /* Tables */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #f8fafc;
      border-bottom: 1px solid var(--border-light);
      padding: 11px 16px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      white-space: nowrap;
    }

    td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border-light);
      font-size: 13px;
      color: var(--text-secondary);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr.clickable-row {
      cursor: pointer;
      transition: background 0.12s ease;
    }

    tbody tr.clickable-row:hover {
      background: #f5f7ff;
    }

    /* Form Controls */
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .input, .select, .textarea {
      width: 100%;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-primary);
      background: #f8fafc;
      border: 1px solid var(--border-med);
      border-radius: var(--radius-sm);
      padding: 8px 11px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .input:focus, .select:focus, .textarea:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--indigo-600);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    /* Rating Buttons */
    .rating-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .rating-btn {
      border: 1px solid var(--border-med);
      background: #ffffff;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      padding: 9px 4px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.12s ease;
    }

    .rating-btn:hover {
      background: var(--bg-subtle);
    }

    .rating-btn.sel-0 { background: #475569; color: #fff; border-color: #334155; }
    .rating-btn.sel-1 { background: var(--rose-600); color: #fff; border-color: var(--rose-700); }
    .rating-btn.sel-2 { background: var(--amber-500); color: #fff; border-color: var(--amber-700); }
    .rating-btn.sel-3 { background: var(--blue-600); color: #fff; border-color: var(--blue-700); }
    .rating-btn.sel-4 { background: var(--emerald-600); color: #fff; border-color: var(--emerald-700); }

    /* Domain Tabs */
    .domain-tabs-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .domain-tab-btn {
      text-align: left;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      background: var(--bg-surface);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .domain-tab-btn:hover {
      border-color: var(--indigo-200);
      background: #fafbff;
    }

    .domain-tab-btn.active {
      background: var(--indigo-600);
      border-color: var(--indigo-700);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    /* Evidence Tag Pills */
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: var(--radius-full);
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border-med);
      background: #ffffff;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .tag-pill:hover {
      border-color: var(--indigo-600);
      background: var(--indigo-50);
    }

    .tag-pill.active {
      background: var(--indigo-600);
      color: #ffffff;
      border-color: var(--indigo-700);
    }

    /* Component Item */
    .component-row {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-light);
    }

    .component-row:last-child {
      border-bottom: none;
    }

    .component-split {
      display: grid;
      grid-template-columns: 7fr 5fr;
      gap: 20px;
      align-items: start;
    }

    .lookfor-box {
      background: var(--sky-50);
      border: 1px solid var(--sky-200);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .lookfor-box ul {
      margin: 6px 0 0;
      padding-left: 18px;
    }

    .lookfor-box li {
      margin-bottom: 4px;
    }

    .score-panel {
      background: #f8fafc;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 14px;
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 18px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      overflow: hidden;
      padding: 2px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.35s ease;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 6px;
      font-size: 10px;
      font-weight: 800;
      color: #ffffff;
    }

    /* Sign-in screen (Netlify Identity) */
    body.auth-locked .top-header,
    body.auth-locked .main-container {
      display: none;
    }

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(circle at 15% 10%, var(--indigo-50), transparent 45%),
        radial-gradient(circle at 85% 90%, var(--emerald-50), transparent 45%),
        var(--bg-canvas);
    }

    .auth-screen.hidden {
      display: none;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .auth-card h1 {
      font-size: 20px;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .auth-card p {
      margin: 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-form label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .auth-form .btn {
      width: 100%;
      justify-content: center;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .auth-link {
      background: none;
      border: none;
      padding: 0;
      color: var(--indigo-700);
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      align-self: center;
    }

    .auth-message {
      font-size: 13px;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      border: 1px solid transparent;
    }

    .auth-message.error {
      background: var(--rose-50);
      border-color: var(--rose-200);
      color: var(--rose-800);
    }

    .auth-message.success {
      background: var(--emerald-50);
      border-color: var(--emerald-200);
      color: var(--emerald-800);
    }

    .auth-foot {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      border-top: 1px solid var(--border-light);
      padding-top: 12px;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .user-chip-email {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.38);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .modal-backdrop.hidden {
      display: none;
    }

    /* Responsive Breakpoints */

      .grid-3 { grid-template-columns: 1fr; }
      .grid-5, .grid-6 { grid-template-columns: 1fr; }

    .component-note {
      min-height: 120px;
      resize: vertical;
      line-height: 1.5;
    }

    @page {
      size: letter;
      margin: 0.5in;
    }

    @media print {

  <script>
    // =========================================================================
    // 1. SAFE STORAGE WRAPPER (PREVENTS SANDBOXED IFRAME SECURITY ERRORS)
    // =========================================================================
    const memoryStorage = {};

    function safeGetItem(key) {
      try {
        return window.localStorage.getItem(key);
      } catch (e) {
        return Object.prototype.hasOwnProperty.call(memoryStorage, key) ? memoryStorage[key] : null;
      }
    }

    function safeSetItem(key, value) {
      memoryStorage[key] = value;
      try {
        window.localStorage.setItem(key, value);
      } catch (e) {
        // Fallback silently to in-memory store in restricted iframes
      }
    }

    function safeRemoveItem(key) {
      delete memoryStorage[key];
      try {
        window.localStorage.removeItem(key);
      } catch (e) {
        // Ignore in restricted iframes
      }
    }

    function loadJSON(key, fallback) {
      try {
        const raw = safeGetItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveJSON(key, val) {
      try {
        safeSetItem(key, JSON.stringify(val));
      } catch (e) {

    // =========================================================================

    const ALL_COMPONENTS = RUBRIC_DOMAINS.flatMap(d => d.components);

    const GLOBAL_EVIDENCE_TAGS = [
      'Think-Pair-Share A/B',
      'ABCD Cards / Plickers',
      'Timer Used',
      'Primary Source Evidence',
      'Cold Call / Show Call',
      'Anchor Chart Scaffold',
      'Individual Feedback',
      'Bell Ringer On-Time',
      'Time Reserved for DOL'
    ];

    const RATING_SCALE = [
      { value: 0, label: 'Not Applicable / Not Observed', short: '0 N/A' },
      { value: 1, label: 'Rarely / Seldom', short: '1' },
      { value: 2, label: 'Sometimes / Occasionally', short: '2' },
      { value: 3, label: 'Frequently / Almost Always', short: '3' },
      { value: 4, label: 'Always / Consistently', short: '4' }
    ];

    // =========================================================================
    // 3. DEFAULT ROSTER & STORAGE KEYS
    // =========================================================================
    const STORAGE_KEYS = {
      OBSERVATIONS: 'walkthroughiq_sy26_27_obs_v4',
      TEACHERS: 'walkthroughiq_sy26_27_teachers_v4',
      OBSERVERS: 'walkthroughiq_sy26_27_observers_v4',
      DRAFT: 'walkthroughiq_sy26_27_draft_v4',
      OUTBOX: 'walkthroughiq_sy26_27_outbox_v2',
      SYNC_PING: 'walkthroughiq_sync_ping'

    const DEFAULT_TEACHERS = ['L. Hawkins', 'K. Yoder', 'M. Schaefer'];
    const DEFAULT_OBSERVERS = [];

    // =========================================================================
    // 4. APPLICATION STATE & INITIALIZATION
    // =========================================================================
    const urlParams = new URLSearchParams(window.location.search);
    const initialMode = urlParams.get('mode') === 'new' ? 'observe' : 'dashboard';
    const preselectedTeacherParam = urlParams.get('teacher') || '';

    let timerInterval = null;

    let state = {
      currentView: initialMode, // 'dashboard' | 'observe' | 'history' | 'analytics'
      observations: [],
      teachers: [],
      observers: [],
      savedDraft: null,
      historySearch: '',
      historyTeacherFilter: 'ALL',
      analyticsFilter: {
        teacher: 'ALL',
        domain: 'ALL',
        component: 'ALL',
        observer: 'ALL',
        tag: 'ALL',
        preset: 'ALL',
        startDate: '',
        endDate: '',

        sortDir: 'asc'

    function getReferenceTodayISO() {
      // Uses current date if >= 2026-11-17, otherwise aligns cleanly with SY26-27 timeline
      const nowISO = new Date().toISOString().slice(0, 10);
      return nowISO < '2026-11-17' ? '2026-11-17' : nowISO;
    }

    function getTodayISO() {
      return getReferenceTodayISO();
    }

    function getCurrentTimeFormatted() {
      const d = new Date();
      let hrs = d.getHours();
      const mins = String(d.getMinutes()).padStart(2, '0');
      const ampm = hrs >= 12 ? 'PM' : 'AM';
      hrs = hrs % 12 || 12;
      return `${hrs}:${mins} ${ampm}`;
    }

    function formatFullTimestamp(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      let hrs = dateObj.getHours();
      const mins = String(dateObj.getMinutes()).padStart(2, '0');
      const secs = String(dateObj.getSeconds()).padStart(2, '0');
      const ampm = hrs >= 12 ? 'PM' : 'AM';
      hrs = hrs % 12 || 12;
      return `${yyyy}-${mm}-${dd} ${String(hrs).padStart(2, '0')}:${mins}:${secs} ${ampm}`;
    }

    function formatDuration(seconds) {
      const total = Math.max(0, Math.floor(seconds || 0));
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const item = document.createElement('div');
      item.className = 'toast-item ' + (type || 'info');
      item.textContent = message;
      container.appendChild(item);
      setTimeout(() => {
        if (item.parentNode) item.parentNode.removeChild(item);
      }, 3600);
    }

    function updateOfflineIndicator(label) {
      const el = document.getElementById('offline-status-text');
      if (el) el.textContent = label || 'Offline-Ready • Auto-Saved';
    }

    const CLASS_PERIODS = ['1st Period', '2nd Period', '3rd Period', '4th Period', '5th Period', '6th Period', '7th Period', '8th Period'];

    function createBlankFormState(startTimer, preselectedTeacher) {
      const now = new Date();
      return {
        layoutMode: 'matrix',
        teacher: preselectedTeacher || '',
        observer: state.observers[0] || '',
        date: getTodayISO(),
        scheduledTime: getCurrentTimeFormatted(),
        classPeriod: '',
        lessonCodes: '',
        startEpoch: startTimer ? now.getTime() : null,
        startTimestamp: startTimer ? formatFullTimestamp(now) : '',
        scores: {},
        notes: {},
        componentTags: {},
        expandedLookFors: {},
        evidenceTags: [],
        duringNotes: '',
        glows: '',
        grows: '',
        nextActionStep: '',
        photos: []
      };
    }

    function resetObservationFormState(startTimer, preselectedTeacher) {
      state.form = createBlankFormState(startTimer, preselectedTeacher);
      if (startTimer) startLiveTimerLoop();
    }

    function startLiveTimerLoop() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (state.currentView === 'observe' && state.form && state.form.startEpoch) {
          const el = document.getElementById('live-timer-display');
          if (el) {
            const elapsed = Math.floor((Date.now() - state.form.startEpoch) / 1000);
            el.textContent = formatDuration(elapsed);
          }
        }
      }, 1000);
    }

    function persistActiveDraft() {
      if (!state.form) return;
      const draftPayload = {
        ...state.form,
        savedAt: formatFullTimestamp(new Date())
      };
      saveJSON(STORAGE_KEYS.DRAFT, draftPayload);
      state.savedDraft = draftPayload;
      updateOfflineIndicator('Auto-Saved ' + getCurrentTimeFormatted());
    }

    function resumeSavedDraft() {
      const draft = loadJSON(STORAGE_KEYS.DRAFT, null);
      if (!draft) {
        showToast('No saved draft found.', 'error');
        return;
      }
      state.form = {
        ...createBlankFormState(true),
        ...draft,
        layoutMode: 'matrix',
        startEpoch: draft.startEpoch || Date.now()
      };
      state.currentView = 'observe';
      startLiveTimerLoop();
      renderApp();
      showToast('Resumed unfinished walkthrough draft.', 'success');
    }

    function discardSavedDraft() {
      safeRemoveItem(STORAGE_KEYS.DRAFT);
      state.savedDraft = null;
      renderApp();
      showToast('Discarded saved draft.', 'info');
    }

    // =========================================================================
    // 5. SCORING & CADENCE CALCULATIONS
    // =========================================================================
    function calcObservationAverage(obs) {
      if (!obs || !obs.scores) return null;
      const valid = ALL_COMPONENTS
        .map(c => obs.scores[c.id])
        .filter(v => typeof v === 'number' && v >= 1 && v <= 4);
      if (valid.length === 0) return null;
      return valid.reduce((a, b) => a + b, 0) / valid.length;
    }

    function calcDomainAverageForObs(obs, domainId) {
      const domain = RUBRIC_DOMAINS.find(d => d.id === domainId);
      if (!domain || !obs || !obs.scores) return null;
      const valid = domain.components
        .map(c => obs.scores[c.id])
        .filter(v => typeof v === 'number' && v >= 1 && v <= 4);
      if (valid.length === 0) return null;
      return valid.reduce((a, b) => a + b, 0) / valid.length;
    }

    function getScoreBadgeInfo(avg) {
      if (avg === null || avg === undefined) {
        return { badgeClass: 'badge-slate', barColor: '#94a3b8' };
      }
      if (avg < 2.3) {
        return { badgeClass: 'badge-rose', barColor: '#e11d48' };
      }
      if (avg < 2.85) {
        return { badgeClass: 'badge-amber', barColor: '#f59e0b' };
      }
      if (avg < 3.45) {
        return { badgeClass: 'badge-blue', barColor: '#2563eb' };
      }
      return { badgeClass: 'badge-emerald', barColor: '#059669' };
    }

    function getDaysBetweenISO(dateA, dateB) {
      const a = new Date(dateA + 'T00:00:00');
      const b = new Date(dateB + 'T00:00:00');
      return Math.max(0, Math.round((b - a) / (1000 * 60 * 60 * 24)));
    }

    function getTeacherCadenceInfo(teacherName) {
      const tObs = state.observations
        .filter(o => o.teacher === teacherName)
        .sort((a, b) => b.date.localeCompare(a.date));

      const todayISO = getReferenceTodayISO();
      const lastObs = tObs[0] || null;
      const daysSince = lastObs ? getDaysBetweenISO(lastObs.date, todayISO) : null;

      const avgs = tObs.map(calcObservationAverage).filter(v => v !== null);
      const avg = avgs.length ? avgs.reduce((a, b) => a + b, 0) / avgs.length : null;

      let status = 'Overdue (>25d)';
      let badgeClass = 'badge-rose';
      let rowClass = 'overdue';

      if (daysSince !== null && daysSince <= 14) {
        status = 'On Track (≤14d)';
        badgeClass = 'badge-emerald';
        rowClass = 'on-track';
      } else if (daysSince !== null && daysSince <= 25) {
        status = 'Due Soon (15–25d)';
        badgeClass = 'badge-amber';
        rowClass = 'due-soon';
      } else if (daysSince === null) {
        status = 'No Visits Yet';
        badgeClass = 'badge-rose';
        rowClass = 'overdue';
      }

      return {
        name: teacherName,
        count: tObs.length,
        lastDate: lastObs ? lastObs.date : null,
        daysSince,
        avg,
        status,
        badgeClass,
        rowClass
      };
    }

    // =========================================================================
    // 6. NAVIGATION & NEW-TAB LAUNCHER
    // =========================================================================
    function navigateTo(view) {
      state.currentView = view;
      if (view === 'observe' && (!state.form || !state.form.startEpoch)) {
        resetObservationFormState(true);
      }
      renderApp();
    }

    function launchNewObservationTab(preselectedTeacher) {
      const targetTeacher = preselectedTeacher || '';
      try {
        const baseUrl = window.location.href.split('?')[0];
        const query = '?mode=new' + (targetTeacher ? '&teacher=' + encodeURIComponent(targetTeacher) : '');
        const win = window.open(baseUrl + query, '_blank');
        if (win) {
          showToast('Opened a fresh observation session in a new browser tab!', 'success');
          return;
        }
      } catch (e) {
        // Fallback below if sandbox blocks window.open
      }

      // Safe In-App Fallback when popups are blocked by sandboxed preview iframe
      resetObservationFormState(true, targetTeacher);
      state.currentView = 'observe';
      renderApp();
      showToast('Started new live observation workspace (new-tab popup was restricted by preview sandbox).', 'info');
    }

    function handlePhotoUpload(event) {
      const files = Array.from(event.target.files || []);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = async function (e) {
          state.form.photos.push({
            caption: file.name.replace(/\.[^/.]+$/, '') || 'Classroom Artifact',
            dataUrl: await downscaleImageDataUrl(e.target.result)
          });
          persistActiveDraft();
          renderApp();
          showToast('Added classroom photo: ' + file.name, 'success');
        };
        reader.readAsDataURL(file);
      });
    }

    // Shrinks large phone photos before they are stored, so saves stay fast.
    function downscaleImageDataUrl(dataUrl, maxSize) {
      const limit = maxSize || 1600;
      return new Promise(resolve => {
        if (!/^data:image\/(jpeg|png|webp)/.test(dataUrl)) return resolve(dataUrl);
        const img = new Image();
        img.onload = function () {
          const scale = Math.min(1, limit / Math.max(img.width, img.height));
          if (scale === 1 && dataUrl.length < 900000) return resolve(dataUrl);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          try {
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          } catch (err) {
            resolve(dataUrl);
          }
        };
        img.onerror = function () { resolve(dataUrl); };
        img.src = dataUrl;
      });
    }

    function submitObservation() {
      const f = state.form;
      if (!f.teacher || !f.observer || !f.date || !f.classPeriod) {
        showToast('Please select Teacher, Observer, Date, and Class Period before submitting.', 'error');
        return;
      }

      const endNow = new Date();
      const endTimestamp = formatFullTimestamp(endNow);
      const durationSeconds = f.startEpoch ? Math.max(1, Math.floor((endNow.getTime() - f.startEpoch) / 1000)) : 600;

      const mergedTags = Array.from(new Set([
        ...f.evidenceTags,
        ...Object.values(f.componentTags || {}).flat()
      ]));

      const newObs = {
        id: 'obs-' + Date.now(),
        teacher: f.teacher,
        observer: f.observer,
        date: f.date,
        scheduledTime: f.scheduledTime || getCurrentTimeFormatted(),
        classPeriod: f.classPeriod || '',
        lessonCodes: f.lessonCodes.trim() || 'Unspecified',
        startTimestamp: f.startTimestamp || endTimestamp,
        endTimestamp,
        durationSeconds,
        scores: { ...f.scores },
        notes: { ...f.notes },
        componentTags: JSON.parse(JSON.stringify(f.componentTags || {})),
        duringNotes: f.duringNotes.trim(),
        glows: f.glows.trim(),
        grows: f.grows.trim(),
        nextActionStep: f.nextActionStep.trim(),
        evidenceTags: mergedTags,
        photos: [...f.photos]
      };

      state.observations.unshift(newObs);
      queueObservationForSync(newObs);
      safeRemoveItem(STORAGE_KEYS.DRAFT);
      state.savedDraft = null;

      if (timerInterval) clearInterval(timerInterval);
      resetObservationFormState(false);

      renderApp();
      openReportModal(newObs.id);

    // =========================================================================

    function getFilteredObservations() {
      const af = state.analyticsFilter;
      return state.observations.filter(obs => {
        if (af.teacher !== 'ALL' && obs.teacher !== af.teacher) return false;
        if (af.observer !== 'ALL' && obs.observer !== af.observer) return false;
        if (af.tag !== 'ALL' && !(obs.evidenceTags || []).includes(af.tag)) return false;
        if (af.startDate && obs.date < af.startDate) return false;
        if (af.endDate && obs.date > af.endDate) return false;
        return true;
      });
    }

    function applyAnalyticsPreset(preset) {
      state.analyticsFilter.preset = preset;
      const refToday = getReferenceTodayISO();
      const base = new Date(refToday + 'T00:00:00');
      if (preset === 'ALL') {
        state.analyticsFilter.startDate = '';
        state.analyticsFilter.endDate = '';
      } else if (preset === '7D') {
        const d = new Date(base);
        d.setDate(d.getDate() - 7);
        state.analyticsFilter.startDate = d.toISOString().slice(0, 10);
        state.analyticsFilter.endDate = refToday;
      } else if (preset === '30D') {
        const d = new Date(base);
        d.setDate(d.getDate() - 30);
        state.analyticsFilter.startDate = d.toISOString().slice(0, 10);
        state.analyticsFilter.endDate = refToday;
      } else if (preset === '90D') {
        const d = new Date(base);
        d.setDate(d.getDate() - 90);
        state.analyticsFilter.startDate = d.toISOString().slice(0, 10);
        state.analyticsFilter.endDate = refToday;
      }
      renderApp();
    }

        state.analyticsFilter.sortCol = col;

        endDate: '',

        sortDir: 'asc'

    function renderAnalytics() {
      const af = state.analyticsFilter;
      const filteredObs = getFilteredObservations();

      let targetComponents = ALL_COMPONENTS;
      if (af.domain !== 'ALL') targetComponents = targetComponents.filter(c => c.domainId === af.domain);
      if (af.component !== 'ALL') targetComponents = targetComponents.filter(c => c.id === af.component);

      const compRows = targetComponents.map(comp => {
        let sum = 0, ratedCount = 0, naCount = 0;
        const dist = { 1: 0, 2: 0, 3: 0, 4: 0 };

        filteredObs.forEach(obs => {
          const val = obs.scores && obs.scores[comp.id];
          if (val === 0) {
            naCount++;
          } else if (typeof val === 'number' && val >= 1 && val <= 4) {
            sum += val;
            ratedCount++;
            dist[val]++;
          }
        });

        const avgScore = ratedCount > 0 ? sum / ratedCount : null;
        const lowPct = ratedCount > 0 ? Math.round(((dist[1] + dist[2]) / ratedCount) * 100) : 0;
        return { ...comp, ratedCount, naCount, avgScore, dist, lowPct };
      });

      const sortedCompRows = [...compRows].sort((a, b) => {
        const dir = af.sortDir === 'asc' ? 1 : -1;
        if (af.sortCol === 'number') return (a.number - b.number) * dir;
        if (af.sortCol === 'name') return a.name.localeCompare(b.name) * dir;
        if (af.sortCol === 'ratedCount') return (a.ratedCount - b.ratedCount) * dir;
        if (af.sortCol === 'lowPct') return (a.lowPct - b.lowPct) * dir;
        if (a.avgScore === null && b.avgScore === null) return 0;
        if (a.avgScore === null) return 1;
        if (b.avgScore === null) return -1;
        return (a.avgScore - b.avgScore) * dir;
      });

      const ratedOnly = compRows.filter(c => c.avgScore !== null).sort((a, b) => a.avgScore - b.avgScore);
      const topStruggle = ratedOnly[0] || null;
      const topStrength = ratedOnly[ratedOnly.length - 1] || null;

      // Teacher Performance Summary Table
      const teacherList = Array.from(new Set([...state.teachers, ...filteredObs.map(o => o.teacher)]));
      const teacherRows = teacherList.map(tName => {
        const tObs = filteredObs.filter(o => o.teacher === tName);
        const avgs = tObs.map(calcObservationAverage).filter(v => v !== null);
        const overallAvg = avgs.length ? avgs.reduce((a, b) => a + b, 0) / avgs.length : null;
        const dEnv = tObs.map(o => calcDomainAverageForObs(o, 'domain_env')).filter(v => v !== null);
        const dInst = tObs.map(o => calcDomainAverageForObs(o, 'domain_inst')).filter(v => v !== null);
        const dMon = tObs.map(o => calcDomainAverageForObs(o, 'domain_mon')).filter(v => v !== null);

        let lowestForTeacher = null;
        ALL_COMPONENTS.forEach(c => {
          const vals = tObs.map(o => o.scores && o.scores[c.id]).filter(v => typeof v === 'number' && v >= 1 && v <= 4);
          if (vals.length > 0) {
            const cAvg = vals.reduce((a, b) => a + b, 0) / vals.length;
            if (!lowestForTeacher || cAvg < lowestForTeacher.avg) {
              lowestForTeacher = { name: c.name, avg: cAvg };
            }
          }
        });

        return {
          name: tName,
          obsCount: tObs.length,
          overallAvg,
          envAvg: dEnv.length ? dEnv.reduce((a, b) => a + b, 0) / dEnv.length : null,
          instAvg: dInst.length ? dInst.reduce((a, b) => a + b, 0) / dInst.length : null,
          monAvg: dMon.length ? dMon.reduce((a, b) => a + b, 0) / dMon.length : null,
          lowestForTeacher
        };
      });

      return `

          </div>

          <!-- Multi-Filter Bar -->

            <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--border-light); padding-bottom:12px;">

                ${[
                  { id: 'ALL', label: 'All Time' },

    function exportAnalyticsCSV() {
      const filteredObs = getFilteredObservations();
      const headers = [
        'Observation ID', 'Date', 'Scheduled Time', 'Class Period', 'Start Timestamp', 'End Timestamp', 'Duration (Mins)',
        'Teacher', 'Observer', 'Lesson Codes', 'Overall Avg', 'Evidence Tags', 'Photo Count',
        ...ALL_COMPONENTS.map(c => c.number + '. ' + c.name),
        'Glows', 'Grows', 'Next Action Step'
      ];

      const rows = filteredObs.map(obs => {
        const avg = calcObservationAverage(obs);
        return [
          obs.id,
          obs.date,
          obs.scheduledTime,
          obs.classPeriod || '',
          obs.startTimestamp || '',
          obs.endTimestamp || '',
          Math.round((obs.durationSeconds || 0) / 60),
          obs.teacher,
          obs.observer,
          obs.lessonCodes,
          avg !== null ? avg.toFixed(2) : '',
          (obs.evidenceTags || []).join('; '),
          (obs.photos || []).length,
          ...ALL_COMPONENTS.map(c => (obs.scores && typeof obs.scores[c.id] === 'number') ? obs.scores[c.id] : ''),
          obs.glows || '',
          obs.grows || '',
          obs.nextActionStep || ''
        ].map(val => '"' + String(val).replace(/"/g, '""') + '"').join(',');
      });

      const csvContent = [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'WalkthroughIQ_G8_SS_Analytics_' + getTodayISO() + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Exported WalkthroughIQ CSV report!', 'success');
    }

    function copyReportToClipboard(obsId) {
      const obs = state.observations.find(o => o.id === obsId);
      if (!obs) return;
      const avg = calcObservationAverage(obs);
      const text = [
        'WALKTHROUGHIQ — INSTRUCTIONAL QUALITY (G8 SOCIAL STUDIES SY26-27)',
        'Teacher: ' + obs.teacher + ' | Observer: ' + obs.observer,
        'Date: ' + obs.date + ' (' + obs.scheduledTime + ') | Class Period: ' + (obs.classPeriod || 'N/A') + ' | Lesson(s): ' + obs.lessonCodes,
        'Start: ' + (obs.startTimestamp || '') + ' | End: ' + (obs.endTimestamp || '') + ' | Overall Avg: ' + (avg !== null ? avg.toFixed(2) : 'N/A') + '/4.0',
        '',
        'GLOWS: ' + (obs.glows || 'N/A'),
        'GROWS: ' + (obs.grows || 'N/A'),
        'NEXT ACTION STEP: ' + (obs.nextActionStep || 'N/A')
      ].join('\n');

      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Copied feedback summary to clipboard!', 'success');
      } catch (e) {
        showToast('Unable to copy automatically.', 'error');
      }
      document.body.removeChild(ta);
    }

    function openRosterModal() {
      const modal = document.getElementById('modal-content');
      modal.innerHTML = `
        <div class="card-padded stack-md" style="background:#ffffff;">
          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-light); padding-bottom:12px;">
            <div>
              <h2 class="card-title" style="font-size:18px;">Manage Teachers &amp; Observers</h2>
              <p class="card-subtitle">Add additional teachers or administrators to the WalkthroughIQ dropdowns</p>
            </div>
            <button type="button" class="btn btn-outline btn-sm" onclick="closeModal()">✕ Close</button>
          </div>

          <div class="grid-2">
            <div class="stack-md">
              <strong style="font-size:13px;">Teachers (${state.teachers.length})</strong>
              <div style="display:flex; gap:6px;">
                <input id="new-teacher-input" type="text" class="input" placeholder="e.g., R. Morales" />
                <button type="button" class="btn btn-primary btn-sm" onclick="addRosterTeacher()">Add</button>
              </div>
              <div style="display:flex; flex-wrap:wrap; gap:6px;">
                ${state.teachers.map(t => `<span class="badge badge-slate">${escapeHtml(t)}</span>`).join('')}
              </div>
            </div>

            <div class="stack-md">
              <strong style="font-size:13px;">Observers (${state.observers.length})</strong>
              <div style="display:flex; gap:6px;">
                <input id="new-observer-input" type="text" class="input" placeholder="e.g., D. Carter" />
                <button type="button" class="btn btn-primary btn-sm" onclick="addRosterObserver()">Add</button>
              </div>
              <div style="display:flex; flex-wrap:wrap; gap:6px;">
                ${state.observers.map(o => `<span class="badge badge-indigo">${escapeHtml(o)}</span>`).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function addRosterTeacher() {
      const inp = document.getElementById('new-teacher-input');
      const val = inp ? inp.value.trim() : '';
      if (!val) return;
      if (!state.teachers.includes(val)) {
        state.teachers.push(val);
        if (state.form) state.form.teacher = val;
        saveRosterEntry('teacher', val);
      }
      openRosterModal();
      renderApp();
    }

    function addRosterObserver() {
      const inp = document.getElementById('new-observer-input');
      const val = inp ? inp.value.trim() : '';
      if (!val) return;
      if (!state.observers.includes(val)) {
        state.observers.push(val);
        if (state.form) state.form.observer = val;
        saveRosterEntry('observer', val);
      }
      openRosterModal();
      renderApp();
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    // =========================================================================
    // 12. MAIN RENDER CONTROLLER & WINDOW ONLOAD BOOTSTRAP
    // =========================================================================
    function renderApp() {
      const badge = document.getElementById('nav-count-badge');
      if (badge) badge.textContent = String(state.observations.length);

      ['dashboard', 'observe', 'history', 'analytics'].forEach(v => {
        const btn = document.getElementById('nav-' + v);
        if (btn) {
          if (state.currentView === v) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        }
      });

      const viewEl = document.getElementById('app-view');
      if (!viewEl) return;

      if (state.currentView === 'observe') {
        viewEl.innerHTML = renderObservationForm();
      } else if (state.currentView === 'history') {
        viewEl.innerHTML = renderHistory();
      } else if (state.currentView === 'analytics') {
        viewEl.innerHTML = renderAnalytics();
      } else {
        viewEl.innerHTML = renderDashboard();
      }
    }

    // =========================================================================
    // 13. SHARED WORKSPACE SYNC (NETLIFY DATABASE VIA /api)
    // =========================================================================
    class ApiError extends Error {
      constructor(message, status) {
        super(message);
        this.status = status;
      }
    }

    async function apiFetch(path, options) {
      const opts = options || {};
      const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      let res;
      try {
        res = await fetch(path, Object.assign({}, opts, { headers, credentials: 'same-origin' }));
      } catch (err) {
        throw new ApiError('Network unavailable', 0);
      }
      const body = await res.json().catch(() => ({}));
      if (res.status === 401) {
        showSignedOut('Your session has ended. Please sign in again.');
        throw new ApiError(body.error || 'Not signed in', 401);
      }
      if (!res.ok) throw new ApiError(body.error || ('Request failed (' + res.status + ')'), res.status);
      return body;
    }

    function getOutbox() {
      return loadJSON(STORAGE_KEYS.OUTBOX, []);
    }

    function applySharedData(data) {
      const pending = getOutbox();
      const serverIds = new Set((data.observations || []).map(o => o.id));
      // Keep observations that were saved on this device but have not reached the server yet
      const unsynced = pending.filter(o => !serverIds.has(o.id));
      state.observations = unsynced.concat(data.observations || []);
      state.teachers = data.teachers || [];
      state.observers = data.observers || [];
    }

    async function loadSharedData() {
      let data = await apiFetch('/api/data');
      if (data.empty) {
        // Brand-new workspace: start clean with just the default teacher roster.
        data = await apiFetch('/api/reset', {
          method: 'POST',
          body: JSON.stringify({
            onlyIfEmpty: true,
            observations: [],
            teachers: DEFAULT_TEACHERS,
            observers: DEFAULT_OBSERVERS
          })
        });
      }
      applySharedData(data);
    }

    let refreshInFlight = false;
    async function refreshSharedData(silent) {
      if (refreshInFlight || !currentUser) return;
      refreshInFlight = true;
      try {
        const before = state.observations.length;
        await loadSharedData();
        renderAppPreservingForm();
        if (!silent && state.observations.length > before) {
          showToast('Synced new observations from your team.', 'success');
        }
      } catch (err) {
        if (err.status !== 401) updateOfflineIndicator('Offline • Changes Saved on Device');
      } finally {
        refreshInFlight = false;
      }
    }

    // Avoid wiping half-typed inputs on the observation form when background sync lands
    function renderAppPreservingForm() {
      if (state.currentView === 'observe') {
        const badge = document.getElementById('nav-count-badge');
        if (badge) badge.textContent = String(state.observations.length);
        return;
      }
      renderApp();
    }

    function notifyOtherTabs() {
      safeSetItem(STORAGE_KEYS.SYNC_PING, String(Date.now()));
    }

    function queueObservationForSync(obs) {
      const outbox = getOutbox().filter(o => o.id !== obs.id);
      outbox.push(obs);
      saveJSON(STORAGE_KEYS.OUTBOX, outbox);
      flushOutbox();
    }

    let flushInFlight = false;
    async function flushOutbox() {
      if (flushInFlight || !currentUser) return;
      const outbox = getOutbox();
      if (!outbox.length) {
        updateOfflineIndicator('Shared Workspace • Synced');
        return;
      }
      flushInFlight = true;
      updateOfflineIndicator('Syncing ' + outbox.length + ' observation' + (outbox.length === 1 ? '' : 's') + '…');
      let failed = 0;
      for (const obs of outbox) {
        try {
          const saved = await apiFetch('/api/observations', { method: 'POST', body: JSON.stringify(obs) });
          const remaining = getOutbox().filter(o => o.id !== obs.id);
          saveJSON(STORAGE_KEYS.OUTBOX, remaining);
          const idx = state.observations.findIndex(o => o.id === saved.id);
          if (idx >= 0) state.observations[idx] = saved;
        } catch (err) {
          failed++;
          if (err.status === 401) break;
        }
      }
      flushInFlight = false;
      if (failed) {
        updateOfflineIndicator('Offline • ' + failed + ' Waiting to Sync');
        showToast('Saved on this device. It will sync to the shared workspace when you are back online.', 'info');
      } else {
        updateOfflineIndicator('Shared Workspace • Synced');
        notifyOtherTabs();
      }
    }

    // Only the signed-in user who created an observation may delete it.
    // Observations still waiting in this device's outbox were created here, so they count as owned.
    function canDeleteObservation(obs) {
      if (!obs || !currentUser) return false;
      if (getOutbox().some(o => o.id === obs.id)) return true;
      return !!obs.submittedBy && obs.submittedBy.toLowerCase() === String(currentUser.email || '').toLowerCase();
    }

    let deleteInFlight = false;
    async function deleteObservation(obsId) {
      const obs = state.observations.find(o => o.id === obsId);
      if (!obs || !canDeleteObservation(obs) || deleteInFlight) return;
      const label = (obs.teacher || 'this teacher') + ' on ' + (obs.date || 'this date');
      if (!window.confirm('Delete the observation of ' + label + '? This cannot be undone.')) return;

      deleteInFlight = true;
      try {
        const wasPending = getOutbox().some(o => o.id === obsId);
        saveJSON(STORAGE_KEYS.OUTBOX, getOutbox().filter(o => o.id !== obsId));
        try {
          await apiFetch('/api/observations/' + encodeURIComponent(obsId), { method: 'DELETE' });
        } catch (err) {
          // A never-synced observation only lived on this device, so removing it locally is enough.
          if (!(wasPending && err.status === 0)) {
            if (wasPending) saveJSON(STORAGE_KEYS.OUTBOX, getOutbox().concat([obs]));
            showToast('Could not delete observation: ' + err.message, 'error');
            return;
          }
        }
        state.observations = state.observations.filter(o => o.id !== obsId);
        closeModal();
        renderApp();
        notifyOtherTabs();
        showToast('Observation deleted.', 'success');
      } finally {
        deleteInFlight = false;
      }
    }

    async function saveRosterEntry(kind, name) {
      try {
        const data = await apiFetch('/api/roster', { method: 'POST', body: JSON.stringify({ kind, name }) });
        state.teachers = data.teachers;
        state.observers = data.observers;
        showToast('Added ' + kind + ': ' + name, 'success');
        notifyOtherTabs();
      } catch (err) {
        const list = kind === 'teacher' ? state.teachers : state.observers;
        const i = list.indexOf(name);
        if (i >= 0) list.splice(i, 1);
        showToast('Could not add ' + kind + ': ' + err.message, 'error');
      }
      if (!document.getElementById('modal-backdrop').classList.contains('hidden')) openRosterModal();
      renderApp();
    }

    // Cross-tab synchronization when another tab saves data
    window.addEventListener('storage', function (e) {
      if (e.key === STORAGE_KEYS.SYNC_PING) refreshSharedData(false);
    });
    window.addEventListener('online', function () { flushOutbox(); refreshSharedData(true); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') refreshSharedData(false);
    });

    // =========================================================================
    // 14. SIGN-IN (NETLIFY IDENTITY — INVITE-ONLY)
    // =========================================================================
    let currentUser = null;
    let appStarted = false;

    function authApi() {
      return window.WIQAuth;
    }

    function waitForAuthLibrary() {
      if (window.WIQAuth) return Promise.resolve(window.WIQAuth);
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error('Sign-in service failed to load. Please refresh the page.')), 15000);
        window.addEventListener('wiq-auth-ready', function () {
          clearTimeout(timer);
          resolve(window.WIQAuth);
        }, { once: true });
      });
    }

    function friendlyAuthError(err, context) {
      const A = authApi();
      if (A && err instanceof A.MissingIdentityError) {
        return 'Sign-in is not available on this deployment yet. Please contact your administrator.';
      }
      const status = err && err.status;
      if (context === 'login' && (status === 400 || status === 401)) return 'Incorrect email or password.';
      if (status === 404) return 'This link is invalid or has already been used.';
      if (status === 422) return (err.message || 'Please check what you entered.') + (context !== 'login' ? ' (Passwords need at least 6 characters.)' : '');
      if (/expired/i.test(err && err.message || '')) return 'This link has expired. Ask your administrator for a new invite, or use "Forgot password".';
      return (err && err.message) || 'Something went wrong. Please try again.';
    }

    function authMessageHtml(msg) {
      if (!msg) return '';
      return '<div class="auth-message ' + (msg.type || 'error') + '">' + escapeHtml(msg.text) + '</div>';
    }

    function setAuthBusy(form, busy, label) {
      const btn = form.querySelector('button[type="submit"]');
      if (!btn) return;
      if (busy) {
        btn.dataset.label = btn.textContent;
        btn.textContent = label || 'Please wait…';
      } else if (btn.dataset.label) {
        btn.textContent = btn.dataset.label;
      }
      btn.disabled = busy;
    }

    function showAuthScreen(html) {
      document.body.classList.add('auth-locked');
      document.getElementById('auth-screen').classList.remove('hidden');
      document.getElementById('auth-body').innerHTML = html;
      const first = document.querySelector('#auth-body input');
      if (first) first.focus();
    }

    function showLoginForm(msg, email) {
      showAuthScreen(`
        <div class="stack-md">
          <div>
            <h1>Sign in</h1>
            <p>Use the email address your invitation was sent to.</p>
          </div>
          ${authMessageHtml(msg)}
          <form class="auth-form" onsubmit="handleLoginSubmit(event)">
            <label>Email
              <input class="input" type="email" name="email" autocomplete="email" required value="${escapeHtml(email || '')}" />
            </label>
            <label>Password
              <input class="input" type="password" name="password" autocomplete="current-password" required />
            </label>
            <button type="submit" class="btn btn-primary">Sign in</button>
          </form>
          <button type="button" class="auth-link" onclick="showForgotPasswordForm()">Forgot password?</button>
        </div>
      `);
    }

    function showSetPasswordForm(mode, msg) {
      const isInvite = mode === 'invite';
      showAuthScreen(`
        <div class="stack-md">
          <div>
            <h1>${isInvite ? 'Welcome! Create your password' : 'Choose a new password'}</h1>
            <p>${isInvite ? 'You were invited to WalkthroughIQ. Set a password to finish creating your account.' : 'Enter a new password for your account.'}</p>
          </div>
          ${authMessageHtml(msg)}
          <form class="auth-form" onsubmit="handleSetPasswordSubmit(event, '${isInvite ? 'invite' : 'recovery'}')">
            <label>New password
              <input class="input" type="password" name="password" autocomplete="new-password" minlength="6" required />
            </label>
            <label>Confirm password
              <input class="input" type="password" name="confirm" autocomplete="new-password" minlength="6" required />
            </label>
            <button type="submit" class="btn btn-primary">${isInvite ? 'Create account &amp; continue' : 'Save password &amp; continue'}</button>
          </form>
        </div>
      `);
    }

    function showForgotPasswordForm(msg) {
      showAuthScreen(`
        <div class="stack-md">
          <div>
            <h1>Reset your password</h1>
            <p>We'll email you a link to choose a new password.</p>
          </div>
          ${authMessageHtml(msg)}
          <form class="auth-form" onsubmit="handleForgotSubmit(event)">
            <label>Email
              <input class="input" type="email" name="email" autocomplete="email" required />
            </label>
            <button type="submit" class="btn btn-primary">Send reset link</button>
          </form>
          <button type="button" class="auth-link" onclick="showLoginForm()">Back to sign in</button>
        </div>
      `);
    }

    let pendingInviteToken = null;

    async function handleLoginSubmit(event) {
      event.preventDefault();
      const form = event.target;
      const email = form.email.value.trim();
      setAuthBusy(form, true, 'Signing in…');
      try {
        const user = await authApi().login(email, form.password.value);
        await enterApp(user);
      } catch (err) {
        showLoginForm({ type: 'error', text: friendlyAuthError(err, 'login') }, email);
      }
    }

    async function handleSetPasswordSubmit(event, mode) {
      event.preventDefault();
      const form = event.target;
      const password = form.password.value;
      if (password !== form.confirm.value) {
        showSetPasswordForm(mode, { type: 'error', text: 'Passwords do not match.' });
        return;
      }
      setAuthBusy(form, true, 'Saving…');
      try {
        let user;
        if (mode === 'invite') {
          user = await authApi().acceptInvite(pendingInviteToken, password);
          pendingInviteToken = null;
        } else {
          user = await authApi().updateUser({ password });
        }
        await enterApp(user);
        showToast(mode === 'invite' ? 'Your account is ready. Welcome to WalkthroughIQ!' : 'Password updated.', 'success');
      } catch (err) {
        showSetPasswordForm(mode, { type: 'error', text: friendlyAuthError(err, mode) });
      }
    }

    async function handleForgotSubmit(event) {
      event.preventDefault();
      const form = event.target;
      setAuthBusy(form, true, 'Sending…');
      try {
        await authApi().requestPasswordRecovery(form.email.value.trim());
      } catch (err) {
        // Same response either way so the form doesn't reveal who has an account
      }
      showLoginForm({ type: 'success', text: 'If that email has an account, a reset link is on its way. Check your inbox.' });
    }

    function showSignedOut(message) {
      currentUser = null;
      closeModal();
      showLoginForm(message ? { type: 'error', text: message } : null);
    }

    async function signOut() {
      try {
        await authApi().logout();
      } catch (err) {
        // Clear the UI even if the network call fails
      }
      currentUser = null;
      closeModal();
      showLoginForm({ type: 'success', text: 'You have been signed out.' });
    }

    async function enterApp(user) {
      currentUser = user;
      const chip = document.getElementById('user-chip-email');
      if (chip) {
        chip.textContent = user.name || user.email;
        chip.title = user.email;
      }
      showAuthScreen('<p>Loading your shared workspace…</p>');
      try {
        await loadSharedData();
      } catch (err) {
        if (err.status === 401) return;
        // Offline or server hiccup: fall back to what this device already has
        applySharedData({
          observations: loadJSON(STORAGE_KEYS.OBSERVATIONS, []),
          teachers: loadJSON(STORAGE_KEYS.TEACHERS, DEFAULT_TEACHERS),
          observers: loadJSON(STORAGE_KEYS.OBSERVERS, DEFAULT_OBSERVERS)
        });
        showToast('Could not reach the shared workspace. Showing data saved on this device.', 'error');
      }

      document.getElementById('auth-screen').classList.add('hidden');
      document.body.classList.remove('auth-locked');

      if (!appStarted) {
        appStarted = true;
        state.savedDraft = loadJSON(STORAGE_KEYS.DRAFT, null);
        resetObservationFormState(state.currentView === 'observe', preselectedTeacherParam);
      }
      renderApp();
      flushOutbox();
    }

    window.onload = async function () {
      let A;
      try {
        A = await waitForAuthLibrary();
      } catch (err) {
        showAuthScreen(authMessageHtml({ type: 'error', text: err.message }));
        return;
      }

      // Signed out in another tab, or the session could not be refreshed
      A.onAuthChange(function (event) {
        if (event === 'logout' && currentUser) showSignedOut('You were signed out.');
      });

      // Handle links from invite / password-reset emails (#invite_token=…, #recovery_token=…)
      try {
        const result = await A.handleAuthCallback();
        if (result) {
          history.replaceState(null, '', window.location.pathname + window.location.search);
          if (result.type === 'invite' && result.token) {
            pendingInviteToken = result.token;
            showSetPasswordForm('invite');
            return;
          }
          if (result.type === 'recovery') {
            currentUser = result.user;
            showSetPasswordForm('recovery');
            return;
          }
          if (result.user) {
            await enterApp(result.user);
            if (result.type === 'confirmation') showToast('Email confirmed. Welcome!', 'success');
            return;
          }
        }
      } catch (err) {
        history.replaceState(null, '', window.location.pathname + window.location.search);
        showLoginForm({ type: 'error', text: friendlyAuthError(err, 'callback') });
        return;
      }

      const user = await A.getUser();
      if (user) {
        await enterApp(user);
      } else {
        showLoginForm();
      }

    };
  </script>
  <script type="module" src="/vendor/identity.js"></script>
